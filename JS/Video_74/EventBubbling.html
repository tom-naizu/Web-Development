<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubbking</title>

    <style>
        .child {

            background-color: rgb(26, 197, 69);
            padding: 14px;
            margin: 14px;
        }

        .childContainer {

            background-color: rgb(21, 235, 224);
            padding: 14px;
            margin: 14px;
        }

        .container {
            background-color: rgb(224, 244, 46);
            padding: 14px;
            margin: 14px;
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="childContainer">
            <div class="child">
                I am Tom Here...#
            </div>
        </div>
    </div>

    <script>
        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation();
            alert("Child was clicked")
        })

        document.querySelector(".childContainer").addEventListener("click", (e) => {
            e.stopPropagation();
            alert("Child Container was clicked")
        })

        document.querySelector(".container").addEventListener("click", (e) => {
            alert("Container was clicked")
        })

        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1},${val2},${val3})`
        }
        // let a = setInterval(() => {
        //     document.querySelector(".childContainer").style.background = getRandomColor();
        // }, 3000);
        
        // console.log(a)

        let a = setTimeout(() => {
            document.querySelector(".childContainer").style.background = getRandomColor();
        }, 3000);
        
        console.log(a)
    </script>

</body>

</html>
